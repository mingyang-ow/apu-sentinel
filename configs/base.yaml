# Shared config -- merged with configs/local.yaml OR configs/colab.yaml
# (selected via CONFIG=), then optionally overlaid with a configs/experiment/
# file. See src/apu_sentinel/config.py for the typed schema this must satisfy.

data:
  # UCI ML Repository, dataset 791 -- confirm this still resolves before
  # relying on it; the exact zip layout can change if UCI re-publishes it.
  url: "https://archive.ics.uci.edu/static/public/791/metropt+3+dataset.zip"
  raw_dir: data/raw
  raw_filename: "MetroPT3(AirCompressor).csv"
  interim_dir: data/interim
  processed_dir: data/processed
  # null = establish mode (download.py prints the computed hash to pin here).
  # a string = verify mode (raises on mismatch). See data/download.py.
  checksum: null

split:
  # Walk-forward (expanding-window) scheme -- see data/split.py. Never a
  # shuffle/ratio split -- CLAUDE.md rule 1.
  #
  # Gap enforced between a fold's train_end and test_start, so that a
  # sliding window straddling the boundary can't pull test-period data into
  # a training sample. Must be >= the longest sequence window any later
  # windowing pass uses; no window length is chosen yet, so this is a
  # generous placeholder the user will raise if a longer window is picked.
  embargo_hours: 24
  training_exclusion:
    # Purge training data from failure onset minus this margin -- covers
    # the ramp-up into a failure, which is not "normal" behaviour to train
    # on.
    pre_margin_hours: 24
    # ...through maintenance/repair plus this many hours -- a compressor
    # needs time to settle into normal operation after a repair.
    post_settle_hours: 24
    # Used instead of post_settle_hours when maintenance is unrecorded
    # (event 1 below has no maintenance entry) -- more conservative since
    # the actual repair/settle time is unknown.
    fallback_post_hours: 48

evaluation:
  # SWEPT list of candidate pre-failure window widths (hours). A project
  # result, not a single magic number -- see CLAUDE.md "pre-failure window
  # width". Widest value (72h / 3 days) is capped by the event-2/event-3
  # proximity constraint: event 2's exclusion region ends ~118h before event
  # 3 starts, and test_start also backs off by embargo_hours (24h) on top of
  # the widest window, tightening the true cap to ~94h -- data/split.py
  # raises loudly (on either the window-width or the test-start overlap
  # check) if this cap is violated.
  window_widths: [6, 12, 24, 48, 72]
  # Hysteresis / hold-time (seconds) used to group flagged timestamps into
  # one episode.
  episode_hold_time: null
  # DEFERRED until baseline behaviour has been observed -- do not set before
  # then.
  false_alarm_ceiling: null
  # Documented MetroPT-3 failure events (UCI dataset 791 failure reports).
  # All four are Air leak / High stress. Notes are part of the documented
  # label-construction decision (CLAUDE.md "Labels are derived, documented,
  # versioned") -- do not strip them.
  failure_events:
    - id: 1
      start: "2020-04-18 00:00"
      end:   "2020-04-18 23:59"
      maintenance: null
      note: "No maintenance entry in the source table; repair time unknown."
    - id: 2
      start: "2020-05-29 23:30"
      end:   "2020-05-30 06:00"
      maintenance: "2020-05-30 12:00"
      note: >
        Source table prints 'Maintenance on 30Apr at 12:00', which predates the
        failure by a month and contradicts the pattern of every other row
        (repair follows failure by hours). Treated as a typo for 30 May 12:00.
        Documented deviation from source.
    - id: 3
      start: "2020-06-05 10:00"
      end:   "2020-06-07 14:30"
      maintenance: "2020-06-08 16:00"
      note: "Source table also mislabels event 2 as '#1'; ids here are sequential."
    - id: 4
      start: "2020-07-15 14:30"
      end:   "2020-07-15 19:00"
      maintenance: "2020-07-16 00:00"

scaling:
  # robust (median / IQR) is the DEFAULT: training data still contains
  # UNREPORTED anomalies -- only the four documented events above can be
  # excluded -- so location/spread estimates should resist the outliers
  # that remain. standard/minmax are supported alternatives, chosen here,
  # never hardcoded in data/scaling.py.
  method: robust
  # The 7 analog sensor channels -- scaled.
  analog_columns:
    [TP2, TP3, H1, DV_pressure, Reservoirs, Oil_temperature, Motor_current]
  # The 8 digital/status channels -- passed through bit-identical; scaling a
  # binary 0/1 flag is meaningless and would distort it.
  passthrough_columns:
    [COMP, DV_eletric, Towers, MPG, LPS, Pressure_switch, Oil_level, Caudal_impulses]

model: {}
