# Shared config -- merged with configs/local.yaml OR configs/colab.yaml
# (selected via CONFIG=), then optionally overlaid with a configs/experiment/
# file. See src/apu_sentinel/config.py for the typed schema this must satisfy.

data:
  # UCI ML Repository, dataset 791 -- confirm this still resolves before
  # relying on it; the exact zip layout can change if UCI re-publishes it.
  url: "https://archive.ics.uci.edu/static/public/791/metropt+3+dataset.zip"
  raw_dir: data/raw
  raw_filename: "MetroPT3(AirCompressor).csv"
  interim_dir: data/interim
  processed_dir: data/processed
  # null = establish mode (download.py prints the computed hash to pin here).
  # a string = verify mode (raises on mismatch). See data/download.py.
  checksum: null

split:
  # Walk-forward (expanding-window) scheme -- see data/split.py. Never a
  # shuffle/ratio split -- CLAUDE.md rule 1.
  #
  # Gap enforced between a fold's train_end and test_start, so that a
  # sliding window straddling the boundary can't pull test-period data into
  # a training sample. Must be >= the longest sequence window any later
  # windowing pass uses; no window length is chosen yet, so this is a
  # generous placeholder the user will raise if a longer window is picked.
  embargo_hours: 24
  training_exclusion:
    # Purge training data from failure onset minus this margin -- covers
    # the ramp-up into a failure, which is not "normal" behaviour to train
    # on.
    pre_margin_hours: 24
    # ...through maintenance/repair plus this many hours -- a compressor
    # needs time to settle into normal operation after a repair.
    post_settle_hours: 24
    # Used instead of post_settle_hours when maintenance is unrecorded
    # (event 1 below has no maintenance entry) -- more conservative since
    # the actual repair/settle time is unknown.
    fallback_post_hours: 48

evaluation:
  # SWEPT list of candidate pre-failure window widths (hours). A project
  # result, not a single magic number -- see CLAUDE.md "pre-failure window
  # width". Widest value (72h / 3 days) is capped by the event-2/event-3
  # proximity constraint: event 2's exclusion region ends ~118h before event
  # 3 starts, and test_start also backs off by embargo_hours (24h) on top of
  # the widest window, tightening the true cap to ~94h -- data/split.py
  # raises loudly (on either the window-width or the test-start overlap
  # check) if this cap is violated.
  window_widths: [6, 12, 24, 48, 72]
  # Alert threshold is a high quantile of TRAINING scores only (see
  # evaluation/metrics.py fit_threshold) -- never a hardcoded score value,
  # never fit on test scores.
  threshold_quantile: 0.995
  # Optional sweep -- fit_threshold_sweep() fits every one of these on
  # train scores and returns the whole curve of results; the test-optimal
  # point must never be hand-picked and reported as "the" result.
  threshold_quantiles: [0.99, 0.995, 0.999]
  # Hysteresis / hold-time used to group flagged timestamps into one
  # episode: a below-threshold stretch shorter than this does not end it.
  # A few multiples of windowing.score_stride (1min) -- long enough to
  # absorb a brief dip without being so generous it merges genuinely
  # separate episodes.
  episode_hold_time: 10min
  # A gap in the score timeline (windows dropped for spanning a data gap --
  # see data/windows.py) longer than this ENDS an episode outright,
  # regardless of episode_hold_time -- absence of evidence is not evidence
  # of continuation. Deliberately wider than episode_hold_time so the two
  # rules stay distinguishable.
  score_gap_threshold: 30min
  # OFF by default (0 = no minimum) -- enabling a minimum episode duration
  # to drop blips is a knowing choice made after seeing baseline behaviour.
  min_episode_duration: 0min
  # How per-timestamp channel contributions are aggregated across an
  # episode's timestamps into its ranked diagnosis (explain/). mean is the
  # default so one momentary spike on an otherwise-quiet channel doesn't
  # dominate the ranking; max is available for the opposite judgement call.
  contribution_aggregation: mean
  # DEFERRED until baseline behaviour has been observed -- do not set before
  # then.
  false_alarm_ceiling: null
  # Documented MetroPT-3 failure events (UCI dataset 791 failure reports).
  # All four are Air leak / High stress. Notes are part of the documented
  # label-construction decision (CLAUDE.md "Labels are derived, documented,
  # versioned") -- do not strip them.
  failure_events:
    - id: 1
      start: "2020-04-18 00:00"
      end:   "2020-04-18 23:59"
      maintenance: null
      note: "No maintenance entry in the source table; repair time unknown."
    - id: 2
      start: "2020-05-29 23:30"
      end:   "2020-05-30 06:00"
      maintenance: "2020-05-30 12:00"
      note: >
        Source table prints 'Maintenance on 30Apr at 12:00', which predates the
        failure by a month and contradicts the pattern of every other row
        (repair follows failure by hours). Treated as a typo for 30 May 12:00.
        Documented deviation from source.
    - id: 3
      start: "2020-06-05 10:00"
      end:   "2020-06-07 14:30"
      maintenance: "2020-06-08 16:00"
      note: "Source table also mislabels event 2 as '#1'; ids here are sequential."
    - id: 4
      start: "2020-07-15 14:30"
      end:   "2020-07-15 19:00"
      maintenance: "2020-07-16 00:00"
  # Extra masked regions beyond the automatic per-event ones (e.g. a known
  # sensor outage unrelated to a documented failure) -- none identified yet.
  additional_masked_regions: []

scaling:
  # robust (median / IQR) is the DEFAULT: training data still contains
  # UNREPORTED anomalies -- only the four documented events above can be
  # excluded -- so location/spread estimates should resist the outliers
  # that remain. standard/minmax are supported alternatives, chosen here,
  # never hardcoded in data/scaling.py.
  method: robust
  # The 7 analog sensor channels -- scaled.
  analog_columns:
    [TP2, TP3, H1, DV_pressure, Reservoirs, Oil_temperature, Motor_current]
  # The 8 digital/status channels -- passed through bit-identical; scaling a
  # binary 0/1 flag is meaningless and would distort it.
  passthrough_columns:
    [COMP, DV_eletric, Towers, MPG, LPS, Pressure_switch, Oil_level, Caudal_impulses]
  # A computed scale below this is treated as zero -- e.g. a channel that is
  # constant (or nearly so) across a fold's training slice -- and 1.0 is
  # substituted instead of dividing by ~0. data/scaling.py logs a WARNING
  # naming the channel and its computed scale when this fires.
  zero_scale_epsilon: 1e-8

windowing:
  # Defaults chosen from the REAL dataset's measured sampling (see
  # data/windows.py characterise_sampling()): modal inter-sample interval is
  # ~10s (1,516,948 rows over ~213 days), so a 30min window is ~180 samples
  # -- long enough to see a full compressor on/off cycle, short enough to
  # keep well under the 24h embargo (data/windows.py raises if this cap is
  # violated).
  window_duration: 30min
  # Coarser than score_stride -- training tolerates less redundancy between
  # windows, and it keeps the training tensor smaller (~30min / 5min = 6x
  # fewer windows than stride-1-minute).
  train_stride: 5min
  # Finer than train_stride -- scoring wants scores mapped back to
  # timestamps densely (one every minute) so episode grouping isn't coarse.
  score_stride: 1min
  # 10% wall-clock slack before a window is dropped for spanning a gap --
  # generous enough to absorb the dataset's normal +/-1-3s sampling jitter
  # (measured: 9-13s intervals dominate, not a clean, unwavering 10s) without
  # tolerating a real gap.
  gap_tolerance: 0.1
  # What counts as a "gap" when characterising raw sampling (separate from
  # gap_tolerance's per-window drop decision) -- the real data has 275 such
  # gaps, the largest ~2 days (the documented failure/maintenance periods
  # and a handful of other recording interruptions).
  gap_threshold: 5min
  resample:
    # OFF by default -- a knowing modeling choice made after reviewing
    # characterise_sampling()'s output, not an automatic default.
    enabled: false
    # Matches the measured modal interval if enabled.
    interval: 10s

regimes:
  # Cross-referenced in regimes.verify_flag_semantics against Motor_current:
  # COMP and MPG track each other almost perfectly (>99.5% agreement on the
  # real data) and DV_eletric is their near-perfect inverse. COMP is used as
  # the deciding flag in `states` below since it is the documented control
  # signal; the other two are kept here purely so verify_flag_semantics can
  # report their agreement rate as evidence, not to vote.
  control_columns: [COMP, DV_eletric, MPG]
  # Empirically derived, NOT assumed -- see the pass-9 write-up. COMP=1 and
  # MPG=1 correlate with near-zero Motor_current (OFF); DV_eletric=1
  # correlates with high Motor_current (ON). This is the OPPOSITE of the
  # naive reading of COMP as "compressor running" -- the source
  # documentation's own hint (COMP active = no air intake) is correct.
  polarity:
    COMP: { 1: "OFF", 0: "ON" }
    DV_eletric: { 1: "ON", 0: "OFF" }
    MPG: { 1: "OFF", 0: "ON" }
  # LOADED (COMP=0) is the only flag-defined state. Rows NOT matching this
  # (COMP=1, "no air intake") are further split into OFFLOAD/STOPPED below
  # -- a third state is empirically real within COMP=1 (~35% of that time,
  # sustained ~400s runs, Motor_current ~3.5-4.3A vs ~0A for true OFF), but
  # NO digital flag combination resolves it (see docs/FINDINGS.md §7) --
  # defining it via a flag condition would mean clustering the analog
  # signal by another name, exactly what this module's docstring warns
  # against. Splitting explicitly by Motor_current below is a deliberate,
  # documented exception, not a silent one.
  states:
    LOADED: { COMP: 0 }
  # Channel + threshold splitting the non-LOADED group into OFFLOAD (>=
  # threshold) vs STOPPED (< threshold). Only 0.015% of OFF samples fall in
  # the 1-3A valley between the two modes (docs/FINDINGS.md §7) -- 2.0A
  # sits in genuine emptiness, not an arbitrary cut point.
  offload_split_channel: Motor_current
  offload_current_threshold: 2.0
  # A newly-changed raw state must persist this long (looking backward)
  # before being committed -- a few multiples of the 10s sampling interval,
  # short enough to only catch flag flicker (raw LOADED runs have a q25 of
  # 0s -- i.e. plenty of single/two-sample noise blips), not real cycling.
  min_duration: 30s
  # Analog channels are still settling this long after a committed state
  # change -- labelled TRANSITION rather than the new state. NOTE: an
  # initial 60s guess (a "bit longer than min_duration") turned out to be
  # badly miscalibrated against the observed run-length distribution: raw
  # LOADED cycles have a median of only ~109s, so a 60s settle window
  # swallowed almost an entire typical cycle. Revised down to 20s (2
  # samples) so a typical committed LOADED run still has genuine
  # steady-state time left after settling. Recorded here as a decision
  # made FROM the evidence, not a first guess kept unexamined.
  transition_settle: 20s
  # Records the INTENT to optionally drop offload_split_channel
  # (Motor_current) from scored channels while OFFLOAD/STOPPED, removing
  # the circularity of using it both to DEFINE those states and to SCORE
  # them (docs/FINDINGS.md §9). OFF by default -- a knowing choice, and NOT
  # wired into scoring in this pass (scoring does not exist yet).
  exclude_motor_current_when_off: false

model: {}
